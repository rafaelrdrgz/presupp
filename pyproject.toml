[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "presupp"
version = "0.1.0"
description = "Detecting philosophical presuppositions in policy and media writing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = ["torch>=2.4,<2.6", "transformers>=4.45,<5"]
dev = ["pytest>=8", "ruff>=0.6"]
# separate environment, see apps/demo/README.md
demo = ["gradio==5.50.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
