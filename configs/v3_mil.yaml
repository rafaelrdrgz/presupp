name: v3_mil
description: >
  v3, passages decided by their sentences: as v3_joint, but a position's passage score is its
  best sentence's score, so every flagged position has a sentence that reaches the mark. IPC is
  still decided from the first token.
model_type: sentence_transformer
passage_from: sentences
confidence_weighting: weights
sentence_loss_weight: 1.0
split: grouped_cv
label_mode: hard
class_weighting: none
scheduler: linear
decay_norm_and_bias: false
selection_metric: macro_pr_auc
threshold_policy: min_positives
threshold_min_positives: 10
decode: ipc_exclusive
model_name: roberta-base
max_length: 512
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.02
dropout: 0.2
freeze_layers: 6
epochs: 20
patience: 5
warmup_ratio: 0.1
seeds: [0, 1, 2]
