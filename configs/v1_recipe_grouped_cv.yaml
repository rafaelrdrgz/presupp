name: v1_recipe_grouped_cv
description: >
  The dissertation's best recipe (lr2e5), unchanged, but evaluated with article-grouped folds:
  every passage of an article is in the same fold. The only difference from
  v1_recipe_passage_cv is the split.
split: grouped_cv
label_mode: soft
class_weighting: inverse_capped
max_class_weight: 15.0
scheduler: onecycle_cosine
decay_norm_and_bias: true
selection_metric: macro_f1_at_0.5
threshold_policy: v1
decode: independent
model_name: roberta-base
max_length: 512
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.02
dropout: 0.2
freeze_layers: 6
epochs: 20
patience: 5
warmup_ratio: 0.1
seeds: [0, 1, 2]
