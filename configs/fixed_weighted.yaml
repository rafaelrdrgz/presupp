name: fixed_weighted
description: >
  fixed_unweighted with v1's class weights added back (a positive counts negatives/positives
  times, capped at 15). The only difference from fixed_unweighted: does weighting help rare
  labels get learned, or only make the probabilities overconfident?
split: grouped_cv
label_mode: hard
class_weighting: inverse_capped
max_class_weight: 15.0
scheduler: linear
decay_norm_and_bias: false
selection_metric: macro_pr_auc
threshold_policy: min_positives
threshold_min_positives: 10
decode: ipc_exclusive
model_name: roberta-base
max_length: 512
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.02
dropout: 0.2
freeze_layers: 6
epochs: 20
patience: 5
warmup_ratio: 0.1
seeds: [0, 1, 2]
