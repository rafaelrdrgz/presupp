name: fixed_unweighted
description: >
  The v1 model with the v2 fixes: yes/no targets, no class weights (rare labels are helped
  by per-label thresholds instead), weight decay off for biases and LayerNorm, linear warmup and
  decay, the best epoch chosen by threshold-free macro average precision, per-label thresholds
  only for labels with at least 10 validation positives, and IPC never predicted together with
  a category. Article-grouped folds.
split: grouped_cv
label_mode: hard
class_weighting: none
scheduler: linear
decay_norm_and_bias: false
selection_metric: macro_pr_auc
threshold_policy: min_positives
threshold_min_positives: 10
decode: ipc_exclusive
model_name: roberta-base
max_length: 512
batch_size: 8
learning_rate: 2.0e-5
weight_decay: 0.02
dropout: 0.2
freeze_layers: 6
epochs: 20
patience: 5
warmup_ratio: 0.1
seeds: [0, 1, 2]
